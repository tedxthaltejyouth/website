<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event feedback — TEDxThaltej Youth</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/config.js"></script>
<script src="/assets/site.js" defer></script>
<style>
  :root{--red:#EB0028;--y:#FFC83D;--n:#101B3D;--c:#FFF4E2;--disp:Anton,Impact,'Arial Narrow',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,Helvetica,Arial,sans-serif;color:var(--n);background:var(--c);-webkit-font-smoothing:antialiased;line-height:1.55}
  button,input,textarea{font:inherit;color:inherit}
  .wrap{width:min(860px,100% - 40px);margin:0 auto;padding:clamp(36px,6vw,70px) 0 90px}
  .k{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.k:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--red)}
  h1{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(50px,8vw,100px);line-height:.95;margin-top:14px}h1 span{color:var(--red)}
  .card{background:#fff;border:2.5px solid var(--n);border-radius:24px;box-shadow:8px 8px 0 var(--n);padding:clamp(20px,4vw,40px);display:grid;gap:22px;margin-top:28px}
  .q{font-weight:800;font-size:19px}
  .nps{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}
  .nps button{aspect-ratio:1;border:2.5px solid var(--n);border-radius:14px;background:#fff;font-weight:900;font-size:clamp(14px,2.4vw,20px);cursor:pointer;transition:transform .15s}
  .nps button:hover{transform:translateY(-3px)}.nps button.on{background:var(--red);color:#fff}
  .nps button.lo.on{background:#e45a5a}.nps button.mid.on{background:var(--y);color:var(--n)}.nps button.hi.on{background:#16a34a}
  .ends{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#5b6283}
  label{display:grid;gap:6px;font-weight:700}
  textarea,input{width:100%;border:2px solid var(--n);border-radius:14px;padding:13px 14px;background:#fff;font-size:16px}textarea{min-height:110px;resize:vertical}
  textarea:focus,input:focus{outline:0;box-shadow:4px 4px 0 var(--red)}
  .btn{display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 26px;border-radius:999px;font-weight:800;font-size:16px;border:2.5px solid var(--n);background:var(--red);color:#fff;cursor:pointer;justify-self:start}
  .btn:disabled{opacity:.55}
  .err{background:#ffe1e6;border:2px solid var(--red);border-radius:14px;padding:12px 14px;font-weight:700}
  .hide{display:none!important}.hp{position:absolute;left:-9999px}
  .note{font-size:13px;color:#5b6283;font-weight:600}
  @media(max-width:560px){.nps{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<main class="wrap">
  <span class="k" id="kk">Feedback</span>
  <h1 id="ttl">How was <span>it?</span></h1>
  <p id="when" style="font-weight:700;margin-top:10px"></p>
  <div id="err" class="err hide" style="margin-top:24px"></div>
  <form class="card hide" id="f" novalidate>
    <input class="hp" name="website" tabindex="-1" autocomplete="off">
    <div style="display:grid;gap:12px"><div class="q">How likely are you to recommend this event to a friend?</div>
      <div class="nps" id="nps"></div><div class="ends"><span>0 · Not at all likely</span><span>10 · Extremely likely</span></div></div>
    <label>What did you like most?<textarea name="liked" maxlength="2000"></textarea></label>
    <label>What could we do better?<textarea name="improve" maxlength="2000"></textarea></label>
    <label>Your email <span class="note">(optional, only so you can't answer twice)</span><input name="email" type="email"></label>
    <p class="note" id="keep"></p>
    <div id="fErr" class="err hide"></div>
    <button class="btn" type="submit">Send feedback →</button>
  </form>
  <div class="card hide" id="done" style="text-align:center;justify-items:center">
    <h1 style="margin:0">Thank <span>you!</span></h1><p style="font-weight:700;font-size:18px">Your feedback helps us make the next one better.</p><a class="btn" href="/events/" style="text-decoration:none;justify-self:center">See upcoming events</a>
  </div>
</main>
<script>
(function(){
  var API=window.TXTY_API||'',q=new URLSearchParams(location.search),slug=q.get('e'),t=q.get('t'),score=null;
  function $(s){return document.querySelector(s);}
  function call(d){return API?fetch(API,{method:'POST',body:JSON.stringify(d)}).then(function(r){return r.json();}).catch(function(){return {ok:false,error:'We could not reach the server. Please try again.'};})
    :Promise.resolve(d.action==='evt_feedbackInfo'?{ok:true,title:'Design Thinking Workshop',when:'Saturday, 6 December 2026 · 2:00 PM IST',closes:'2026-12-13'}:{ok:true});}
  call({action:'evt_feedbackInfo',slug:slug,t:t}).then(function(j){
    if(!j.ok){$('#err').textContent=j.error;$('#err').classList.remove('hide');return;}
    $('#kk').textContent='Feedback · '+j.title;$('#when').textContent=j.when;
    $('#keep').textContent='Your written answers are deleted on '+new Date(j.closes+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+'. Only the 0–10 score is kept, without your name or email.';
    $('#nps').innerHTML=Array.from({length:11},function(_,i){return '<button type="button" class="'+(i<=6?'lo':i<=8?'mid':'hi')+'" data-n="'+i+'" aria-label="'+i+'">'+i+'</button>';}).join('');
    $('#nps').onclick=function(e){var b=e.target.closest('[data-n]');if(!b)return;score=+b.dataset.n;[].forEach.call(document.querySelectorAll('#nps button'),function(x){x.classList.toggle('on',x===b);});};
    $('#f').classList.remove('hide');
  });
  $('#f').onsubmit=function(e){e.preventDefault();var f=e.target,E=$('#fErr');E.classList.add('hide');
    if(score===null){E.textContent='Please choose a score from 0 to 10.';E.classList.remove('hide');return;}
    var b=f.querySelector('button[type=submit]');b.disabled=true;
    call({action:'evt_feedback',slug:slug,t:t,nps:score,liked:f.liked.value,improve:f.improve.value,email:f.email.value,website:f.website.value}).then(function(j){b.disabled=false;
      if(!j.ok){E.textContent=j.error;E.classList.remove('hide');return;}f.classList.add('hide');$('#done').classList.remove('hide');window.scrollTo({top:0,behavior:'smooth'});});};
})();
</script>
</body>
</html>
