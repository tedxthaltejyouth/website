<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side events — TEDxThaltej Youth</title>
<meta name="description" content="Workshops, meetups and gatherings from TEDxThaltej Youth in Ahmedabad, all year round.">
<link rel="canonical" href="https://tedxthaltejyouth.in/events/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/config.js"></script>
<script src="/assets/site.js" defer data-contact="info@tedxthaltejyouth.in"></script>
<style>
  :root{--red:#EB0028;--y:#FFC83D;--b:#2D6BFF;--p:#FF4F8B;--n:#101B3D;--c:#FFF4E2;--disp:Anton,Impact,'Arial Narrow',sans-serif;--ease:cubic-bezier(.2,.7,.1,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,Helvetica,Arial,sans-serif;color:var(--n);background:var(--c);-webkit-font-smoothing:antialiased;line-height:1.55;overflow-x:hidden}
  a{color:inherit}button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--red);outline-offset:3px}
  .wrap{width:min(1180px,100% - 40px);margin:0 auto}
  .k{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
  .k:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--red)}
  .d{font-family:var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:.005em;line-height:.92}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 24px;border-radius:999px;font-weight:800;font-size:16px;border:2.5px solid var(--n);background:var(--n);color:#fff;cursor:pointer;text-decoration:none;transition:transform .25s var(--ease),box-shadow .25s}
  .btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--n)}.btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
  .btn.red{background:var(--red)}.btn.w{background:#fff;color:var(--n)}.btn.y{background:var(--y);color:var(--n)}.btn.sm{height:42px;padding:0 16px;font-size:14px}
  .card{background:#fff;border:2.5px solid var(--n);border-radius:24px;box-shadow:8px 8px 0 var(--n);overflow:hidden}
  .pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--n);border-radius:99px;padding:6px 12px;font-weight:800;font-size:13px;background:#fff}
  .pill.y{background:var(--y)}.pill.r{background:var(--red);color:#fff}.pill.g{background:#e9e4d8}
  .hide{display:none!important}
  .banner-ph{background:linear-gradient(135deg,var(--y),var(--p));display:grid;place-items:center;font-family:var(--disp);font-size:42px;color:var(--n);text-transform:uppercase}

  /* list */
  .top{padding:clamp(40px,6vw,80px) 0 30px}
  .top h1{font-size:clamp(70px,12vw,170px);margin-top:14px}.top h1 span{color:var(--red)}
  .top p{font-size:clamp(17px,1.8vw,21px);font-weight:600;max-width:620px;margin-top:16px}
  .up{display:grid;gap:26px;padding-bottom:60px}
  .ev{display:grid;grid-template-columns:1.1fr 1fr;text-decoration:none;transition:transform .25s var(--ease),box-shadow .25s}
  .ev:hover{transform:translate(-3px,-3px);box-shadow:11px 11px 0 var(--n)}
  .ev .im{min-height:300px;background-size:cover;background-position:center;border-right:2.5px solid var(--n)}
  .ev .tx{padding:clamp(22px,3vw,36px);display:flex;flex-direction:column;gap:12px}
  .ev h2{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(34px,4vw,54px);line-height:.95}
  .dt{display:flex;gap:14px;align-items:center}
  .dt .tile{border:2.5px solid var(--n);border-radius:16px;overflow:hidden;text-align:center;min-width:76px;background:#fff}
  .dt .tile b{display:block;background:var(--red);color:#fff;font-size:12px;letter-spacing:.14em;padding:3px 8px;font-weight:800}
  .dt .tile span{display:block;font-family:var(--disp);font-size:38px;line-height:1.1;padding:2px 8px 4px}
  .meta{font-weight:700;color:#3b4466;font-size:15px}
  @media(max-width:820px){.ev{grid-template-columns:1fr}.ev .im{min-height:200px;border-right:0;border-bottom:2.5px solid var(--n)}}
  .past{background:var(--n);color:#fff;padding:clamp(60px,8vw,100px) 0;border-top:2.5px solid var(--n)}
  .past h2.d{font-size:clamp(48px,7vw,96px);color:#fff}.past h2 span{color:var(--y)}.past .k{color:var(--y)}
  .pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:28px}
  .pc{background:#1b2754;border:2px solid #2c3a6e;border-radius:20px;overflow:hidden;text-decoration:none;color:#fff;transition:transform .2s}
  .pc:hover{transform:translateY(-4px)}.pc .im{height:150px;background-size:cover;background-position:center;filter:grayscale(.35)}
  .pc .tx{padding:16px}.pc b{display:block;font-size:17px;line-height:1.25}.pc small{color:#aab3d6;font-weight:600}
  .empty{padding:40px;text-align:center;font-weight:700;color:#3b4466}

  /* detail */
  .hero{padding:clamp(30px,5vw,60px) 0 40px}
  .back{display:inline-flex;gap:6px;font-weight:800;text-decoration:none;margin-bottom:22px}
  .bn{aspect-ratio:21/9;width:100%;border:2.5px solid var(--n);border-radius:28px;background-size:cover;background-position:center;box-shadow:8px 8px 0 var(--n)}
  .hg{display:grid;grid-template-columns:1.25fr .75fr;gap:34px;margin-top:34px;align-items:start}
  .hero h1{font-size:clamp(54px,8vw,120px)}
  .hero .sub{font-size:clamp(18px,2vw,24px);font-weight:700;margin-top:14px;max-width:640px}
  .info{padding:22px;display:grid;gap:14px;position:sticky;top:100px}
  .info .row{display:grid;grid-template-columns:28px 1fr;gap:10px;font-weight:700}.info .row small{display:block;font-weight:600;color:#5b6283}
  .info .acts{display:grid;gap:10px;margin-top:4px}
  .desc{font-size:18px;margin-top:26px;display:grid;gap:14px;max-width:700px}
  .ag{padding:clamp(50px,7vw,90px) 0;background:var(--y);border-top:2.5px solid var(--n);border-bottom:2.5px solid var(--n)}
  .ag h2{font-size:clamp(48px,7vw,96px)}
  .tl{margin-top:26px;display:grid;gap:0;max-width:860px}
  .tl .it{display:grid;grid-template-columns:130px 26px 1fr;gap:14px;align-items:start}
  .tl .tm{font-family:var(--disp);font-size:26px;line-height:1.2;text-align:right}
  .tl .dot{position:relative;height:100%}.tl .dot:before{content:"";position:absolute;left:11px;top:0;bottom:0;width:3px;background:var(--n)}
  .tl .dot:after{content:"";position:absolute;left:3px;top:8px;width:19px;height:19px;border-radius:50%;background:var(--red);border:3px solid var(--n)}
  .tl .it:last-child .dot:before{bottom:auto;height:20px}
  .tl .bx{background:#fff;border:2.5px solid var(--n);border-radius:16px;padding:12px 16px;margin-bottom:16px}
  .tl .bx b{font-size:18px}.tl .bx p{color:#3b4466;margin-top:4px}
  @media(max-width:700px){.tl .it{grid-template-columns:76px 26px 1fr}.tl .tm{font-size:18px}}
  .rg{padding:clamp(50px,7vw,90px) 0}
  .rg h2{font-size:clamp(48px,7vw,96px)}.rg h2 span{color:var(--red)}
  form.card{padding:clamp(20px,3vw,34px);display:grid;gap:16px;max-width:760px;margin-top:24px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.g2{grid-template-columns:1fr}}
  label{display:grid;gap:6px;font-weight:700;font-size:14px}
  input{width:100%;border:2px solid var(--n);border-radius:14px;padding:13px 14px;background:#fff;font-size:16px}
  input:focus{outline:0;box-shadow:4px 4px 0 var(--red)}
  .chk{display:flex;gap:10px;align-items:flex-start;font-weight:600}.chk input{width:22px;height:22px;flex:none;accent-color:var(--red)}
  .err{background:#ffe1e6;border:2px solid var(--red);border-radius:14px;padding:12px 14px;font-weight:700}
  .ok{background:#e4f7ea;border:2px solid #0b7a3e;border-radius:18px;padding:22px;font-weight:700;font-size:18px}
  .hp{position:absolute;left:-9999px}
  @media(max-width:900px){.hg{grid-template-columns:1fr}.info{position:static}}
</style>
</head>
<body>
<main id="vList">
  <section class="top"><div class="wrap">
    <span class="k">TEDxThaltej Youth · All year round</span>
    <h1 class="d">Side <span>events.</span></h1>
    <p>Workshops, meetups, screenings and conversations between editions. Small rooms, real people, ideas in progress.</p>
  </div></section>
  <section><div class="wrap up" id="upcoming"><div class="empty">Loading…</div></div></section>
  <section class="past hide" id="pastWrap"><div class="wrap">
    <span class="k">Archive</span><h2 class="d">Past <span>events.</span></h2>
    <div class="pg" id="past"></div>
  </div></section>
</main>

<main id="vEvent" class="hide">
  <section class="hero"><div class="wrap">
    <a class="back" href="/events/">← All side events</a>
    <div class="bn" id="eBanner"></div>
    <div class="hg">
      <div>
        <div style="display:flex;gap:8px;flex-wrap:wrap" id="eTags"></div>
        <h1 class="d" id="eTitle" style="margin-top:14px"></h1>
        <p class="sub" id="eSub"></p>
        <div class="desc" id="eDesc"></div>
      </div>
      <aside class="card info" id="eInfo"></aside>
    </div>
  </div></section>
  <section class="ag hide" id="agWrap"><div class="wrap"><span class="k">What happens when</span><h2 class="d" style="margin-top:12px">Agenda</h2><div class="tl" id="eAgenda"></div></div></section>
  <section class="rg hide" id="rgWrap"><div class="wrap">
    <span class="k">Registration</span><h2 class="d" style="margin-top:12px">Save your <span>seat.</span></h2>
    <div id="rgBody"></div>
  </div></section>
</main>

<script>
(function(){
  var API=window.TXTY_API||'';
  function $(s,r){return (r||document).querySelector(s);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function dt(s){var p=String(s).split(/[-T:]/);return new Date(+p[0],+p[1]-1,+p[2],+(p[3]||0),+(p[4]||0));}
  function day(s){return dt(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
  function tm(s){return dt(s).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});}
  function when(e){var t=day(e.starts_at)+' · '+tm(e.starts_at);if(e.ends_at)t+=' – '+(e.ends_at.slice(0,10)===e.starts_at.slice(0,10)?tm(e.ends_at):day(e.ends_at)+' '+tm(e.ends_at));return t;}
  function bg(u){return u?'background-image:url(\''+String(u).replace(/'/g,'%27')+'\')':'';}
  var MOCK={ok:true,events:[
    {id:'EV1',slug:'design-thinking-workshop-ab12',title:'Design Thinking Workshop',subtitle:'An afternoon of making ideas tangible',banner_url:'',starts_at:'2026-12-06T14:00',ends_at:'2026-12-06T17:30',venue:'Ahmedabad University, Navrangpura',map_url:'https://maps.google.com/?q=Ahmedabad+University',host:'TEDxThaltej Youth Curation team',
      description:'A hands-on workshop for students who want to turn a problem they care about into a prototype.\n\nBring a notebook and an open mind. Snacks on us.',agenda:[{time:'2:00 PM',title:'Welcome and warm-up',detail:'Meet the people around you.'},{time:'2:20 PM',title:'Empathy maps',detail:'Find the real problem.'},{time:'3:30 PM',title:'Break',detail:''},{time:'3:45 PM',title:'Prototype sprint',detail:'Paper, tape and courage.'},{time:'5:00 PM',title:'Show and tell',detail:''}],
      reg_mode:'site',reg_open:true,seats_left:24,extra_fields:['institution'],state:'upcoming'},
    {id:'EV2',slug:'film-night-cd34',title:'TEDx Film Night',subtitle:'Three talks, one big screen, open discussion',banner_url:'',starts_at:'2026-12-20T18:30',ends_at:'2026-12-20T20:30',venue:'Thaltej, Ahmedabad',reg_mode:'link',reg_link:'https://forms.gle/example',agenda:[],state:'upcoming',description:'Watch, then talk.'},
    {id:'EV0',slug:'zenith-meetup-ef56',title:'Zenith Community Meetup',banner_url:'',starts_at:'2026-10-12T17:00',venue:'Ahmedabad',reg_mode:'none',agenda:[],state:'past',nps:62}]};
  function load(){return API?fetch(API+'?action=events').then(function(r){return r.json();}):Promise.resolve(MOCK);}
  var slug=new URLSearchParams(location.search).get('e');

  function listView(j){
    var up=j.events.filter(function(e){return e.state!=='past';}),past=j.events.filter(function(e){return e.state==='past';}).reverse();
    $('#upcoming').innerHTML=up.length?up.map(function(e){var d=dt(e.starts_at);
      return '<a class="card ev" href="?e='+encodeURIComponent(e.slug)+'"><div class="im'+(e.banner_url?'':' banner-ph')+'" style="'+bg(e.banner_url)+'">'+(e.banner_url?'':'Side event')+'</div><div class="tx">'+
        '<div class="dt"><div class="tile"><b>'+d.toLocaleDateString('en-GB',{month:'short'}).toUpperCase()+'</b><span>'+d.getDate()+'</span></div><div class="meta">'+esc(d.toLocaleDateString('en-GB',{weekday:'long'}))+' · '+esc(tm(e.starts_at))+'<br>'+esc(e.venue||'Venue to be announced')+'</div></div>'+
        (e.state==='live'?'<span class="pill r">● Happening now</span>':'')+'<h2>'+esc(e.title)+'</h2>'+(e.subtitle?'<p style="font-weight:600">'+esc(e.subtitle)+'</p>':'')+
        '<div style="margin-top:auto;display:flex;gap:8px;flex-wrap:wrap">'+(e.reg_open?'<span class="pill y">Registration open'+(e.seats_left!=null?' · '+e.seats_left+' seats left':'')+'</span>':e.reg_mode==='link'?'<span class="pill y">Register via link</span>':e.reg_mode==='none'?'<span class="pill g">Open to all</span>':'<span class="pill g">Registration closed</span>')+'<span class="pill">Details →</span></div></div></a>';}).join('')
      :'<div class="card empty">No side events are scheduled right now. Follow us on Instagram to hear about the next one.</div>';
    if(past.length){$('#pastWrap').classList.remove('hide');$('#past').innerHTML=past.map(function(e){return '<a class="pc" href="?e='+encodeURIComponent(e.slug)+'"><div class="im'+(e.banner_url?'':' banner-ph')+'" style="'+bg(e.banner_url)+';font-size:26px">'+(e.banner_url?'':'Past')+'</div><div class="tx"><small>'+esc(day(e.starts_at))+'</small><b>'+esc(e.title)+'</b></div></a>';}).join('');}
  }

  function ics(e){
    var f=function(s){var d=dt(s);var u=new Date(d.getTime()-330*60000);return u.toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';};
    var end=e.ends_at||e.starts_at.slice(0,11)+String(Math.min(23,+e.starts_at.slice(11,13)+2)).padStart(2,'0')+e.starts_at.slice(13);
    var body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//TEDxThaltej Youth//Events//EN','BEGIN:VEVENT','UID:'+e.id+'@tedxthaltejyouth.in','DTSTAMP:'+f(new Date(Date.now()+330*60000).toISOString().slice(0,16)),
      'DTSTART:'+f(e.starts_at),'DTEND:'+f(end),'SUMMARY:'+e.title.replace(/[,;]/g,' '),'LOCATION:'+(e.venue||'').replace(/[,;]/g,' '),'URL:'+location.href,'END:VEVENT','END:VCALENDAR'].join('\r\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'text/calendar'}));a.download=e.slug+'.ics';a.click();
  }

  function eventView(e){
    document.title=e.title+' — TEDxThaltej Youth';
    var md=document.querySelector('meta[name=description]');if(md)md.content=e.subtitle||e.title;
    $('#vList').classList.add('hide');$('#vEvent').classList.remove('hide');
    var b=$('#eBanner');if(e.banner_url)b.style.backgroundImage="url('"+String(e.banner_url).replace(/'/g,'%27')+"')";else{b.classList.add('banner-ph');b.textContent=e.title;}
    $('#eTags').innerHTML=(e.state==='live'?'<span class="pill r">● Happening now</span>':e.state==='past'?'<span class="pill g">This event has ended</span>':'<span class="pill y">Upcoming</span>')+(e.host?'<span class="pill">By '+esc(e.host)+'</span>':'');
    $('#eTitle').textContent=e.title;$('#eSub').textContent=e.subtitle||'';
    $('#eDesc').innerHTML=String(e.description||'').split(/\n\s*\n/).filter(Boolean).map(function(p){return '<p>'+esc(p).replace(/\n/g,'<br>')+'</p>';}).join('');
    var cta=e.state==='past'?'':e.reg_mode==='link'?'<a class="btn red" href="'+esc(e.reg_link)+'" target="_blank" rel="noopener">Register →</a>':e.reg_open?'<a class="btn red" href="#rgWrap">Register →</a>':e.reg_mode==='none'?'<span class="pill g" style="justify-content:center">No registration needed</span>':'<span class="pill g" style="justify-content:center">Registration closed</span>';
    $('#eInfo').innerHTML='<div class="row"><span>📅</span><div>'+esc(day(e.starts_at))+'<small>'+esc(tm(e.starts_at))+(e.ends_at?' – '+esc(e.ends_at.slice(0,10)===e.starts_at.slice(0,10)?tm(e.ends_at):day(e.ends_at)+' '+tm(e.ends_at)):'')+' IST</small></div></div>'+
      '<div class="row"><span>📍</span><div>'+esc(e.venue||'Venue to be announced')+(e.map_url?'<small><a href="'+esc(e.map_url)+'" target="_blank" rel="noopener">Open in Maps ↗</a></small>':'')+'</div></div>'+
      (e.seats_left!=null&&e.reg_open?'<div class="row"><span>🎟️</span><div>'+e.seats_left+' seats left</div></div>':'')+
      '<div class="acts">'+cta+(e.state!=='past'?'<button class="btn w sm" id="cal">＋ Add to calendar</button>':'')+'<button class="btn w sm" id="share">Share this event</button></div>';
    if($('#cal'))$('#cal').onclick=function(){ics(e);};
    $('#share').onclick=function(){var d={title:e.title,url:location.href};if(navigator.share)navigator.share(d).catch(function(){});else{try{navigator.clipboard.writeText(location.href);this.textContent='Link copied ✓';}catch(x){}}};
    if(e.agenda&&e.agenda.length){$('#agWrap').classList.remove('hide');$('#eAgenda').innerHTML=e.agenda.map(function(a){return '<div class="it"><div class="tm">'+esc(a.time)+'</div><div class="dot"></div><div class="bx"><b>'+esc(a.title)+'</b>'+(a.detail?'<p>'+esc(a.detail)+'</p>':'')+'</div></div>';}).join('');}
    if(e.state!=='past'&&(e.reg_open||e.reg_mode==='link')){$('#rgWrap').classList.remove('hide');
      if(e.reg_mode==='link'){$('#rgBody').innerHTML='<div class="card" style="padding:28px;max-width:760px;margin-top:24px;display:grid;gap:14px"><p style="font-size:18px;font-weight:600">Registration for this event happens on an outside form.</p><a class="btn red" style="justify-self:start" href="'+esc(e.reg_link)+'" target="_blank" rel="noopener">Open the registration form ↗</a></div>';return;}
      var ex={institution:'School / college / organisation',age:'Age',city:'City',grade:'Class / year'};
      $('#rgBody').innerHTML='<form class="card" id="fReg" novalidate><input class="hp" name="website" tabindex="-1" autocomplete="off"><div class="g2"><label>Full name<input name="name" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label></div>'+
        '<div class="g2"><label>Phone (WhatsApp)<input name="phone" type="tel" autocomplete="tel" placeholder="+91" required></label>'+(e.extra_fields||[]).map(function(k){return '<label>'+ex[k]+'<input name="'+k+'"'+(k==='age'?' type="number" min="5" max="99"':'')+'></label>';}).join('')+'</div>'+
        '<label class="chk"><input type="checkbox" name="consent"> I agree that TEDxThaltej Youth may use these details for this event. They are deleted 7 days after the event.</label><div class="err hide" id="rErr"></div><div><button class="btn red" type="submit">Register →</button></div></form>';
      $('#fReg').onsubmit=function(ev){ev.preventDefault();var f=ev.target,E=$('#rErr');E.classList.add('hide');var d={action:'evt_register',slug:e.slug,consent:f.consent.checked};
        ['website','name','email','phone'].concat(e.extra_fields||[]).forEach(function(k){if(f[k])d[k]=f[k].value;});
        var bt=f.querySelector('button[type=submit]');bt.disabled=true;bt.textContent='Registering…';
        (API?fetch(API,{method:'POST',body:JSON.stringify(d)}).then(function(r){return r.json();}):Promise.resolve(d.consent&&d.name?{ok:true}:{ok:false,error:'Please fill in your details and tick the box.'}))
          .catch(function(){return {ok:false,error:'We could not reach the server. Please try again.'};})
          .then(function(j){bt.disabled=false;bt.textContent='Register →';if(!j.ok){E.textContent=j.error;E.classList.remove('hide');return;}
            $('#rgBody').innerHTML='<div class="ok" style="margin-top:24px;max-width:760px">🎉 You are registered! A confirmation is on its way to your email.</div>';});};
    }
  }

  load().then(function(j){
    if(!j||!j.ok) throw new Error();
    if(slug){var e=j.events.filter(function(x){return x.slug===slug;})[0];if(e)return eventView(e);$('#upcoming').innerHTML='<div class="card empty">That event could not be found. Here is everything that is on.</div>';}
    listView(j);
  }).catch(function(){$('#upcoming').innerHTML='<div class="card empty">We could not load events right now. Please try again in a moment.</div>';});
})();
</script>
</body>
</html>
