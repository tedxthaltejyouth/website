<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Speaker Community — TEDxThaltej Youth</title>
<meta name="description" content="Everyone who has spoken at TEDxThaltej Youth, on the main stage and at our Salons: where they are now, the talks they gave, and the ideas they shared.">
<link rel="canonical" href="https://tedxthaltejyouth.in/speakers/">
<meta property="og:title" content="Our Speaker Community — TEDxThaltej Youth">
<meta property="og:description" content="Everyone who has spoken at TEDxThaltej Youth, on the main stage and at our Salons.">
<link rel="icon" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/config.js"></script>
<script src="/assets/site.js" defer></script>
<style>
  :root{--red:#EB0028;--y:#FFC83D;--n:#101B3D;--c:#FFF4E2;--mute:#5b6283;--disp:Anton,Impact,'Arial Narrow',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,Helvetica,Arial,sans-serif;color:var(--n);background:var(--c);-webkit-font-smoothing:antialiased;line-height:1.55}
  button,input{font:inherit;color:inherit}
  .wrap{width:min(1160px,100% - 40px);margin:0 auto}
  .k{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.k:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--red)}
  h1{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(54px,9vw,128px);line-height:.9;margin-top:14px}h1 span{color:var(--red)}
  .hero{padding:clamp(40px,7vw,90px) 0 30px;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:end}
  .lead{font-size:clamp(17px,2vw,21px);margin-top:18px;font-weight:500;max-width:640px}
  .stat{background:var(--n);color:#fff;border-radius:28px;padding:26px;display:grid;gap:12px}
  .stat div{display:flex;gap:14px;align-items:baseline}.stat b{font-family:var(--disp);font-weight:400;font-size:46px;line-height:1;color:var(--y);min-width:80px}
  .stat a{color:var(--y);font-weight:800;text-decoration:none;font-size:14px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 24px}
  .bar input{border:2px solid var(--n);border-radius:999px;padding:11px 18px;background:#fff;font-weight:600;min-width:260px;flex:1;max-width:360px}
  .chip{border:2px solid var(--n);background:#fff;border-radius:999px;padding:9px 16px;font-weight:800;cursor:pointer;font-size:14px}.chip.on{background:var(--y)}
  .grp{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(30px,4vw,46px);margin:34px 0 14px;display:flex;align-items:baseline;gap:12px}.grp small{font-family:Inter;font-size:14px;font-weight:700;color:var(--mute);text-transform:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
  .sp{background:#fff;border:2.5px solid var(--n);border-radius:24px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
  .sp:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--n)}
  .sp .ph{aspect-ratio:4/5;background:#e9e1d1 center/cover no-repeat;position:relative}
  .sp .tag{position:absolute;left:12px;top:12px;background:var(--n);color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.sp .tag.s{background:var(--y);color:var(--n)}
  .sp .c{padding:14px 16px 16px;display:grid;gap:4px}.sp b{font-size:17px;line-height:1.2}.sp small{color:var(--mute);font-size:13px}.sp i{font-size:13.5px}
  .empty{background:#fff;border:2.5px dashed var(--n);border-radius:24px;padding:40px;text-align:center}
  .cta{margin:60px 0 80px;background:var(--n);color:#fff;border-radius:32px;padding:clamp(26px,4vw,44px);display:flex;gap:24px;align-items:center;flex-wrap:wrap}
  .cta h2{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(32px,4vw,50px);line-height:.95;flex:1;min-width:260px}.cta h2 span{color:var(--y)}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;border-radius:999px;padding:14px 24px;font-weight:900;text-decoration:none}.btn.l{background:#fff;color:var(--n)}
  /* profile */
  .pro{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(24px,5vw,60px);padding:clamp(30px,5vw,60px) 0 40px;align-items:start}
  .pro .ph{border:3px solid var(--n);border-radius:32px;aspect-ratio:4/5;background:#e9e1d1 center/cover no-repeat;box-shadow:12px 12px 0 var(--y)}
  .pro h1{font-size:clamp(46px,7vw,96px)}.pro .des{font-size:20px;font-weight:700;margin-top:10px}
  .badge{display:inline-block;border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px;background:var(--n);color:#fff}.badge.s{background:var(--y);color:var(--n)}
  .talk{margin-top:22px;background:#fff;border:2.5px solid var(--n);border-radius:24px;padding:20px 22px}
  .talk small{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}.talk b{display:block;font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(26px,3vw,36px);line-height:1;margin-top:6px}
  .talk p{font-size:14px;color:var(--mute);margin-top:6px}.talk a{color:var(--red);font-weight:800;text-decoration:none}
  .bio{font-size:17px;margin-top:22px;white-space:pre-wrap}
  .links{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .vid{margin:10px 0 50px;border:3px solid var(--n);border-radius:28px;overflow:hidden;aspect-ratio:16/9;background:#000}.vid iframe{width:100%;height:100%;border:0;display:block}
  .back{display:inline-block;margin-top:24px;font-weight:800;color:var(--n);text-decoration:none}
  .more{margin-bottom:70px}
  @media(max-width:860px){.hero,.pro{grid-template-columns:1fr}.pro .ph{max-width:420px}}
</style>
</head>
<body>
<main class="wrap" id="app"><p style="padding:80px 0">Loading…</p></main>
<script>
(function(){
  var API=window.TXTY_API||'',PREVIEW=!API,$=function(s){return document.querySelector(s);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var DATA=null,F='all',Q='';
  function get(){if(PREVIEW)return Promise.resolve(DEMO);return fetch(API,{method:'POST',body:JSON.stringify({action:'cm_public'})}).then(function(r){return r.json();});}
  function card(p){return '<a class="sp" href="?s='+encodeURIComponent(p.slug)+'"><div class="ph" style="background-image:url(&quot;'+esc(p.photo)+'&quot;)"><span class="tag'+(p.salon?' s':'')+'">'+(p.salon?'Salon':esc(p.year))+'</span></div><div class="c"><b>'+esc(p.name)+'</b>'+(p.designation?'<small>'+esc(p.designation)+'</small>':'')+(p.talk?'<i>“'+esc(p.talk)+'”</i>':'')+'</div></a>';}
  function list(){
    var ppl=DATA.people,years=[];ppl.forEach(function(p){if(!p.salon&&years.indexOf(p.year)<0)years.push(p.year);});years.sort().reverse();
    var salon=ppl.filter(function(p){return p.salon;}).length,main=ppl.length-salon;
    document.title='Our Speaker Community — TEDxThaltej Youth';
    $('#app').innerHTML='<section class="hero"><div><span class="k">Speaker Community</span><h1>Our <span>speakers</span>,<br>always.</h1><p class="lead">Everyone who has shared an idea with TEDxThaltej Youth, on our main stage and at our Salons. Where they are now, the talks they gave, and the ideas that keep travelling.</p></div>'+
      '<div class="stat"><div><b>'+main+'</b><span>main-stage speakers</span></div><div><b>'+salon+'</b><span>Salon speakers</span></div><a href="/community/">Spoke with us? Sign in to the community →</a></div></section>'+
      '<div class="bar"><input id="q" placeholder="Search a name, talk or field…" value="'+esc(Q)+'" aria-label="Search speakers"><button class="chip'+(F==='all'?' on':'')+'" data-f="all">Everyone</button>'+years.map(function(y){return '<button class="chip'+(F===y?' on':'')+'" data-f="'+esc(y)+'">'+esc(y)+'</button>';}).join('')+(salon?'<button class="chip'+(F==='salon'?' on':'')+'" data-f="salon">Salon speakers</button>':'')+'</div><div id="res"></div>'+
      '<section class="cta"><h2>Spoke at TEDxThaltej Youth? <span>Come home.</span></h2><a class="btn" href="/community/">Speaker Community sign-in</a><a class="btn l" href="/#editions">See our editions</a></section>';
    var draw=function(){var q=Q.toLowerCase(),rows=ppl.filter(function(p){return (F==='all'||(F==='salon'?p.salon:(!p.salon&&p.year===F)))&&(!q||[p.name,p.talk,p.designation,p.bio_line,p.label].join(' ').toLowerCase().indexOf(q)>=0);});
      if(!rows.length){$('#res').innerHTML='<div class="empty">No speakers to show yet.</div>';return;}
      var groups=[];rows.forEach(function(p){var g=p.salon?'Salon speakers':(p.event?p.event.title.split(':')[0]+' '+p.year:p.year);var x=groups.filter(function(y){return y.t===g;})[0];if(!x)groups.push(x={t:g,sub:p.salon?'Our intimate, curated TEDx Salon evenings':(p.event&&p.event.title.indexOf(':')>0?p.event.title.split(':').slice(1).join(':'):''),p:[]});x.p.push(p);});
      $('#res').innerHTML=groups.map(function(g){return '<h2 class="grp">'+esc(g.t)+(g.sub?'<small>'+esc(g.sub)+'</small>':'')+'</h2><div class="grid">'+g.p.map(card).join('')+'</div>';}).join('');};
    draw();$('#q').oninput=function(e){Q=e.target.value;draw();};
    document.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){F=b.dataset.f;list();};});
  }
  function profile(slug){
    var p=DATA.people.filter(function(x){return x.slug===slug;})[0];
    if(!p){$('#app').innerHTML='<section style="padding:80px 0"><span class="k">Speaker Community</span><h1 style="font-size:60px">Not found</h1><p class="lead">This speaker’s page isn’t available.</p><a class="back" href="/speakers/">← All speakers</a></section>';return;}
    document.title=p.name+' — TEDxThaltej Youth Speaker Community';
    var others=DATA.people.filter(function(x){return x.slug!==p.slug&&x.salon===p.salon&&x.year===p.year;}).slice(0,4);
    $('#app').innerHTML='<a class="back" href="/speakers/">← Our Speaker Community</a><section class="pro"><div class="ph" style="background-image:url(&quot;'+esc(p.photo)+'&quot;)" role="img" aria-label="'+esc(p.name)+'"></div><div>'+
      '<span class="badge'+(p.salon?' s':'')+'">'+esc(p.salon?'TEDx Salon speaker':'Main-stage speaker · '+p.year)+'</span><h1>'+esc(p.name)+'</h1>'+(p.designation?'<p class="des">'+esc(p.designation)+'</p>':'')+
      (p.talk||p.event?'<div class="talk"><small>'+(p.salon?'Spoke at':'Spoke on our stage')+'</small><b>'+esc(p.talk||p.event.title)+'</b><p>'+(p.event?esc(p.event.title)+(p.event.date?' · '+new Date(p.event.date+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}):'')+' · <a href="'+esc(p.event.url)+'">See the event →</a>':esc(p.label))+'</p></div>':'')+
      '<p class="bio">'+esc(p.bio)+'</p><div class="links">'+(p.yt?'<a class="btn" href="#watch">▶ Watch the talk</a>':'')+(p.linkedin?'<a class="btn l" style="border:2px solid var(--n)" href="'+esc(p.linkedin)+'" target="_blank" rel="noopener">LinkedIn ↗</a>':'')+'</div></div></section>'+
      (p.yt?'<div class="vid" id="watch"><iframe src="https://www.youtube-nocookie.com/embed/'+esc(p.yt)+'" title="'+esc(p.talk||p.name)+'" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>':'')+
      (others.length?'<div class="more"><h2 class="grp">More from '+(p.salon?'our Salons':esc(p.year))+'</h2><div class="grid">'+others.map(card).join('')+'</div></div>':'<div class="more"></div>');
    window.scrollTo(0,0);
  }
  function route(){var s=new URLSearchParams(location.search).get('s');if(s)profile(s);else list();}
  document.addEventListener('click',function(e){var a=e.target.closest('a[href^="?s="],a[href="/speakers/"]');if(!a||e.metaKey||e.ctrlKey)return;e.preventDefault();history.pushState(null,'',a.getAttribute('href')==='/speakers/'?'/speakers/':'/speakers/'+a.getAttribute('href'));route();});
  window.onpopstate=route;
  var DEMO={ok:true,people:[
    {slug:'asha-rao',name:'Asha Rao',photo:'/assets/letterhead/seal.png',designation:'Hydrologist',talk:'What the dry well taught me',year:'2025',salon:false,label:'Edition 1 · 2025 · Kaleidoscope',event:{title:'TEDxThaltej Youth: Kaleidoscope',date:'2025-06-01',url:'/2025/'},bio:'Asha maps groundwater with school students across Gujarat. Her talk followed one village well through three summers.',linkedin:'https://linkedin.com',yt:'aqz-KE-bpKQ'},
    {slug:'dev-shah',name:'Dev Shah',photo:'/assets/letterhead/seal.png',designation:'Founder, CodeSchool',talk:'Code as a second language',year:'2026',salon:false,label:'Edition 2 · 2026 · Echoes',event:{title:'TEDxThaltej Youth: Echoes',date:'2026-06-01',url:'/2026/'},bio:'Dev teaches programming in Gujarati.'},
    {slug:'kabir-mehta',name:'Kabir Mehta',photo:'/assets/letterhead/seal.png',designation:'Class 11 student',talk:'The quiet power of boredom',year:'2026',salon:false,label:'Edition 2 · 2026 · Echoes',event:{title:'TEDxThaltej Youth: Echoes',date:'2026-06-01',url:'/2026/'},bio:'Kabir writes about attention.'},
    {slug:'mira-joshi',name:'Mira Joshi',photo:'/assets/letterhead/seal.png',designation:'Ceramic artist',talk:'Clay and patience',year:'2026',salon:true,label:'Salon speaker · Speaker Mixer · 2026',event:{title:'TEDxThaltej Youth Salon: Slow',date:'2026-12-12',url:'/events/'},bio:'Mira is a ceramic artist from Ahmedabad who teaches clay to children.'}]};
  get().then(function(r){DATA=r.ok?r:{people:[]};route();}).catch(function(){DATA={people:[]};route();});
})();
</script>
</body>
</html>
