<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News — TEDxThaltej Youth</title>
<meta name="description" content="News, announcements, stories and press releases from TEDxThaltej Youth, Ahmedabad.">
<link rel="canonical" href="https://tedxthaltejyouth.in/news/">
<meta property="og:type" content="website"><meta property="og:site_name" content="TEDxThaltej Youth">
<meta property="og:title" content="News — TEDxThaltej Youth"><meta property="og:description" content="News, announcements and stories from TEDxThaltej Youth.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/config.js"></script>
<script src="/assets/md.js"></script>
<script src="/assets/site.js" defer data-contact="info@tedxthaltejyouth.in"></script>
<style>
  :root{--red:#EB0028;--y:#FFC83D;--b:#2D6BFF;--p:#FF4F8B;--n:#101B3D;--c:#FFF4E2;--disp:Anton,Impact,'Arial Narrow',sans-serif;--serif:'Source Serif 4',Georgia,serif;--ease:cubic-bezier(.2,.7,.1,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,Helvetica,Arial,sans-serif;color:var(--n);background:var(--c);-webkit-font-smoothing:antialiased;line-height:1.55;overflow-x:hidden}
  a{color:inherit}button,input{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--red);outline-offset:3px}
  .wrap{width:min(1180px,100% - 40px);margin:0 auto}
  .k{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.k:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--red)}
  .d{font-family:var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:.005em;line-height:.92}
  .card{background:#fff;border:2.5px solid var(--n);border-radius:24px;box-shadow:8px 8px 0 var(--n);overflow:hidden}
  .pill{display:inline-flex;align-items:center;border:2px solid var(--n);border-radius:99px;padding:5px 12px;font-weight:800;font-size:12px;background:#fff;letter-spacing:.04em;text-transform:uppercase}
  .pill.y{background:var(--y)}
  .hide{display:none!important}
  .ph{background:linear-gradient(135deg,var(--y),var(--p));display:grid;place-items:center;font-family:var(--disp);font-size:40px;text-transform:uppercase}
  .top{padding:clamp(40px,6vw,80px) 0 26px}
  .top h1{font-size:clamp(80px,14vw,200px)}.top h1 span{color:var(--red)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:20px 0 30px}
  .bar button{border:2px solid var(--n);background:#fff;border-radius:99px;padding:8px 14px;font-weight:800;cursor:pointer;font-size:14px}
  .bar button.on{background:var(--n);color:#fff}
  .bar input{margin-left:auto;border:2px solid var(--n);border-radius:99px;padding:9px 16px;min-width:240px;background:#fff}
  .feat{display:grid;grid-template-columns:1.2fr 1fr;text-decoration:none;margin-bottom:30px;transition:transform .25s var(--ease),box-shadow .25s}
  .feat:hover,.tile:hover{transform:translate(-3px,-3px);box-shadow:11px 11px 0 var(--n)}
  .feat .im{min-height:360px;background-size:cover;background-position:center;border-right:2.5px solid var(--n)}
  .feat .tx{padding:clamp(22px,3vw,40px);display:flex;flex-direction:column;gap:14px;justify-content:center}
  .feat h2{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(36px,4.4vw,62px);line-height:.95}
  .feat p{font-size:18px;color:#3b4466}
  .by{font-size:13px;font-weight:700;color:#5b6283}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;padding-bottom:90px}
  .tile{text-decoration:none;display:flex;flex-direction:column;transition:transform .25s var(--ease),box-shadow .25s}
  .tile .im{height:200px;background-size:cover;background-position:center;border-bottom:2.5px solid var(--n)}
  .tile .tx{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
  .tile h3{font-size:21px;line-height:1.2;letter-spacing:-.01em}.tile p{color:#3b4466;font-size:15px}
  .tile .by{margin-top:auto}
  @media(max-width:820px){.feat{grid-template-columns:1fr}.feat .im{min-height:220px;border-right:0;border-bottom:2.5px solid var(--n)}.bar input{margin-left:0;width:100%}}
  .empty{padding:40px;text-align:center;font-weight:700}

  /* article */
  .art{padding:clamp(30px,5vw,60px) 0 40px}
  .back{display:inline-flex;font-weight:800;text-decoration:none;margin-bottom:20px}
  .head{max-width:900px}
  .head h1{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(46px,7vw,96px);line-height:.95;margin-top:16px}
  .dek{font-family:var(--serif);font-size:clamp(20px,2.2vw,26px);line-height:1.45;margin-top:18px;color:#2c3560}
  .byline{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px;font-weight:700;font-size:14px}
  .byline .av{width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900}
  .byline span.sep{color:#9aa0b8}
  figure.hero{margin:30px 0 0}
  figure.hero img{width:100%;max-height:620px;object-fit:cover;border:2.5px solid var(--n);border-radius:24px;box-shadow:8px 8px 0 var(--n);display:block;background:#eee}
  figure.hero figcaption{font-size:13px;color:#5b6283;margin-top:12px;font-weight:600}
  .lay{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:50px;margin-top:40px;align-items:start}
  .body{font-family:var(--serif);font-size:20px;line-height:1.75;max-width:720px}
  .body p{margin:0 0 1.1em}.body h2{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:38px;line-height:1;margin:1.4em 0 .5em;letter-spacing:.01em}
  .body h3{font-family:Inter,sans-serif;font-size:21px;margin:1.3em 0 .4em}
  .body a{color:var(--red);text-decoration:underline;text-underline-offset:3px}
  .body blockquote{border-left:6px solid var(--red);padding:6px 0 6px 22px;margin:1.3em 0;font-style:italic;font-size:24px;line-height:1.5}
  .body ul,.body ol{margin:0 0 1.1em 1.3em}.body li{margin:.3em 0}
  .body figure{margin:1.6em 0}.body figure img{width:100%;border-radius:18px;border:2.5px solid var(--n)}.body figcaption{font-family:Inter;font-size:13px;color:#5b6283;margin-top:8px}
  .side{position:sticky;top:100px;display:grid;gap:18px}
  .box{padding:18px;display:grid;gap:10px}.box h4{font-size:12px;letter-spacing:.16em;text-transform:uppercase}
  .toc a{display:block;text-decoration:none;font-weight:700;padding:5px 0;border-bottom:1px solid #eee;font-size:14px}.toc a:hover{color:var(--red)}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .cite .tabs{display:flex;gap:4px;flex-wrap:wrap}.cite .tabs button{border:2px solid var(--n);background:#fff;border-radius:99px;padding:4px 10px;font-weight:800;font-size:12px;cursor:pointer}.cite .tabs button.on{background:var(--n);color:#fff}
  .cite pre{white-space:pre-wrap;word-break:break-word;background:#f7f3ea;border-radius:12px;padding:12px;font-size:12.5px;font-family:ui-monospace,Menlo,monospace;line-height:1.5}
  .cite button.cp,.sh button{border:2px solid var(--n);background:var(--y);border-radius:99px;padding:8px 14px;font-weight:800;cursor:pointer}
  .sh{display:flex;gap:8px;flex-wrap:wrap}.sh a,.sh button{border:2px solid var(--n);border-radius:99px;padding:8px 14px;font-weight:800;text-decoration:none;background:#fff;font-size:13px}
  .meta-t td{padding:3px 10px 3px 0;font-size:13px;vertical-align:top}.meta-t td:first-child{color:#5b6283;font-weight:700;white-space:nowrap}
  .more{background:var(--n);color:#fff;padding:clamp(50px,7vw,90px) 0;margin-top:60px}
  .more h2{font-size:clamp(44px,6vw,80px);color:#fff}.more h2 span{color:var(--y)}.more .k{color:var(--y)}
  .more .grid{padding:28px 0 0}.more .tile{color:var(--n)}
  @media(max-width:960px){.lay{grid-template-columns:1fr}.side{position:static}}
</style>
</head>
<body>
<main id="vList">
  <section class="top"><div class="wrap">
    <span class="k">Newsroom</span>
    <h1 class="d">News<span>.</span></h1>
    <div class="bar" id="bar"></div>
    <div id="list"><div class="card empty">Loading…</div></div>
  </div></section>
</main>

<main id="vArt" class="hide">
  <article class="art"><div class="wrap">
    <a class="back" href="/news/">← All news</a>
    <header class="head"><div style="display:flex;gap:8px;flex-wrap:wrap" id="aTags"></div><h1 id="aTitle"></h1><p class="dek" id="aDek"></p><div class="byline" id="aBy"></div></header>
    <figure class="hero hide" id="aFig"><img id="aImg" alt=""><figcaption id="aCap"></figcaption></figure>
    <div class="lay">
      <div class="body" id="aBody"></div>
      <aside class="side">
        <div class="card box toc hide" id="aToc"><h4>In this article</h4><div id="aTocL"></div></div>
        <div class="card box cite"><h4>Cite this article</h4><div class="tabs" id="cTabs"></div><pre id="cOut"></pre><button class="cp" id="cCopy">Copy citation</button>
          <table class="meta-t" id="aMeta"></table></div>
        <div class="card box"><h4>Share</h4><div class="sh" id="aShare"></div></div>
      </aside>
    </div>
  </div></article>
  <section class="more hide" id="moreWrap"><div class="wrap"><span class="k">Keep reading</span><h2 class="d" style="margin-top:12px">More <span>news.</span></h2><div class="grid" id="more"></div></div></section>
</main>

<script>
(function(){
  var API=window.TXTY_API||'',SITE='https://tedxthaltejyouth.in';
  function $(s){return document.querySelector(s);}
  var esc=TXMD.esc;
  function dlong(d){return d?new Date(d.slice(0,10)+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'';}
  function mins(w){return Math.max(1,Math.round((w||0)/220))+' min read';}
  function bg(u){return u?"background-image:url('"+String(u).replace(/'/g,'%27')+"')":'';}
  var SAMPLE_BODY='## A new vantage point\n\nThe Zenith asks a simple question: what changes when you see the same world from a different height? Our third edition brings together young people from across Ahmedabad who have found an unexpected angle on something we all take for granted.\n\n> The world itself may not have changed. Our vantage point did.\n\n## What to expect\n\n- Talks from students, researchers and makers\n- Performances from Virasat, the Arts and Culture Space\n- A full day of conversation\n\nRegistrations open soon. [See the 2027 edition page](/2027).';
  var MOCK={ok:true,categories:['Announcement','Press release','Story','Event recap'],articles:[
    {id:'NW1',slug:'announcing-the-zenith-ab12',title:'Announcing The Zenith: TEDxThaltej Youth 2027',summary:'Our third edition, on 26 June 2027, explores what becomes visible when our vantage point changes.',image_url:'',image_alt:'',author:'TEDxThaltej Youth',category:'Announcement',tags:['The Zenith','2027'],published_at:'2026-11-10',updated_at:'2026-11-10T10:00:00',words:620,body:SAMPLE_BODY},
    {id:'NW2',slug:'kaleidoscope-recap-cd34',title:'Kaleidoscope, in numbers and in stories',summary:'A look back at our second edition and the people who made it happen.',image_url:'',author:'Curation team',category:'Event recap',tags:['2026'],published_at:'2026-07-02',words:900,body:SAMPLE_BODY},
    {id:'NW3',slug:'ais-first-cycle-ef56',title:'Ahmedabad Idea Search completes its first listening cycle',summary:'Stewards across the city referred ideas in Gujarati, Hindi and English.',image_url:'',author:'AIS team',category:'Idea Search',tags:['AIS'],published_at:'2026-09-20',words:480,body:SAMPLE_BODY}]};
  function get(q){return API?fetch(API+'?'+q).then(function(r){return r.json();}):Promise.resolve(q.indexOf('action=article')===0?(function(){var s=new URLSearchParams(q).get('slug'),a=MOCK.articles.filter(function(x){return x.slug===s;})[0];return a?{ok:true,article:a,publisher:'TEDxThaltej Youth'}:{ok:false};})():MOCK);}
  var slug=new URLSearchParams(location.search).get('a');

  function tile(a){return '<a class="card tile" href="?a='+encodeURIComponent(a.slug)+'"><div class="im'+(a.image_url?'':' ph')+'" style="'+bg(a.image_url)+'">'+(a.image_url?'':esc(a.category))+'</div><div class="tx"><span class="pill y" style="align-self:flex-start">'+esc(a.category)+'</span><h3>'+esc(a.title)+'</h3><p>'+esc(a.summary)+'</p><div class="by">'+esc(dlong(a.published_at))+' · '+mins(a.words)+'</div></div></a>';}

  function listView(j){
    var cat='',q='';
    var cats=j.categories.filter(function(c){return j.articles.some(function(a){return a.category===c;});});
    $('#bar').innerHTML=(cats.length>1?'<button class="on" data-c="">All</button>'+cats.map(function(c){return '<button data-c="'+esc(c)+'">'+esc(c)+'</button>';}).join(''):'')+'<input id="q" placeholder="Search news" aria-label="Search news">';
    function draw(){
      var rows=j.articles.filter(function(a){return (!cat||a.category===cat)&&(!q||(a.title+' '+a.summary+' '+a.tags.join(' ')).toLowerCase().indexOf(q)>=0);});
      if(!rows.length){$('#list').innerHTML='<div class="card empty">'+(j.articles.length?'No articles match.':'No news yet. Check back soon.')+'</div>';return;}
      var f=rows[0];
      $('#list').innerHTML='<a class="card feat" href="?a='+encodeURIComponent(f.slug)+'"><div class="im'+(f.image_url?'':' ph')+'" style="'+bg(f.image_url)+'">'+(f.image_url?'':'Latest')+'</div><div class="tx"><span class="pill y" style="align-self:flex-start">'+esc(f.category)+'</span><h2>'+esc(f.title)+'</h2><p>'+esc(f.summary)+'</p><div class="by">'+esc(f.author)+' · '+esc(dlong(f.published_at))+' · '+mins(f.words)+'</div></div></a>'+
        '<div class="grid">'+rows.slice(1).map(tile).join('')+'</div>';
    }
    $('#bar').onclick=function(e){var b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;[].forEach.call(document.querySelectorAll('#bar [data-c]'),function(x){x.classList.toggle('on',x===b);});draw();};
    $('#q').oninput=function(e){q=e.target.value.toLowerCase().trim();draw();};
    draw();
  }

  function setMeta(n,v,prop){var m=document.querySelector((prop?'meta[property="':'meta[name="')+n+'"]');if(!m){m=document.createElement('meta');m.setAttribute(prop?'property':'name',n);document.head.appendChild(m);}m.setAttribute('content',v);}

  function articleView(j,all){
    var a=j.article,url=SITE+'/news/?a='+a.slug,pub=j.publisher||'TEDxThaltej Youth';
    document.title=a.title+' — TEDxThaltej Youth';
    var can=document.querySelector('link[rel=canonical]');if(can)can.href=url;
    setMeta('description',a.summary||a.title);setMeta('og:type','article',1);setMeta('og:title',a.title,1);setMeta('og:description',a.summary||'',1);setMeta('og:url',url,1);if(a.image_url)setMeta('og:image',a.image_url,1);
    setMeta('article:published_time',a.published_at,1);setMeta('citation_title',a.title);setMeta('citation_author',a.author);setMeta('citation_publication_date',(a.published_at||'').replace(/-/g,'/'));setMeta('citation_publisher',pub);
    var ld=document.createElement('script');ld.type='application/ld+json';
    ld.textContent=JSON.stringify({'@context':'https://schema.org','@type':'NewsArticle',headline:a.title,description:a.summary,image:a.image_url?[a.image_url]:undefined,datePublished:a.published_at,dateModified:(a.updated_at||a.published_at||'').slice(0,10),
      author:[{'@type':/TEDxThaltej/i.test(a.author)?'Organization':'Person',name:a.author}],publisher:{'@type':'Organization',name:pub,logo:{'@type':'ImageObject',url:SITE+'/assets/logo-black.png'}},mainEntityOfPage:url,articleSection:a.category,keywords:(a.tags||[]).join(', ')});
    document.head.appendChild(ld);
    $('#vList').classList.add('hide');$('#vArt').classList.remove('hide');
    $('#aTags').innerHTML='<span class="pill y">'+esc(a.category)+'</span>';
    $('#aTitle').textContent=a.title;$('#aDek').textContent=a.summary||'';
    var ini=String(a.author||'T').split(/\s+/).map(function(w){return w[0];}).slice(0,2).join('');
    var upd=a.updated_at&&a.updated_at.slice(0,10)>a.published_at;
    $('#aBy').innerHTML='<span class="av">'+esc(ini)+'</span><span>By '+esc(a.author)+'</span><span class="sep">·</span><time datetime="'+esc(a.published_at)+'">'+esc(dlong(a.published_at))+'</time>'+(upd?'<span class="sep">·</span><span>Updated '+esc(dlong(a.updated_at))+'</span>':'')+'<span class="sep">·</span><span>'+mins(a.words)+'</span>';
    if(a.image_url){$('#aFig').classList.remove('hide');$('#aImg').src=a.image_url;$('#aImg').alt=a.image_alt||'';$('#aCap').textContent=[a.image_alt,a.image_credit?'Photo: '+a.image_credit:''].filter(Boolean).join(' · ');}
    var r=TXMD.render(a.body);$('#aBody').innerHTML=r.html+((a.tags||[]).length?'<div class="tags" style="margin-top:30px;font-family:Inter">'+a.tags.map(function(t){return '<span class="pill">#'+esc(t)+'</span>';}).join('')+'</div>':'');
    if(r.headings.length>=2){$('#aToc').classList.remove('hide');$('#aTocL').innerHTML=r.headings.map(function(h){return '<a href="#'+h.id+'">'+esc(h.text)+'</a>';}).join('');}
    // citation
    var d=new Date(a.published_at+'T00:00'),Y=d.getFullYear(),M=d.toLocaleDateString('en-GB',{month:'long'}),D=d.getDate(),Ms=d.toLocaleDateString('en-GB',{month:'short'}),today=new Date();
    var acc=today.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
    var C={APA:a.author+'. ('+Y+', '+M+' '+D+'). '+a.title+'. '+pub+'. '+url,
      MLA:a.author+'. “'+a.title+'.” '+pub+', '+D+' '+Ms+'. '+Y+', '+url.replace('https://','')+'. Accessed '+acc+'.',
      Chicago:a.author+'. “'+a.title+'.” '+pub+', '+M+' '+D+', '+Y+'. '+url+'.',
      BibTeX:'@online{'+a.slug.replace(/-/g,'_')+',\n  author = {'+a.author+'},\n  title = {'+a.title+'},\n  organization = {'+pub+'},\n  date = {'+a.published_at+'},\n  url = {'+url+'},\n  urldate = {'+today.toISOString().slice(0,10)+'}\n}'};
    var cur='APA';function showC(){$('#cOut').textContent=C[cur];[].forEach.call(document.querySelectorAll('#cTabs button'),function(b){b.classList.toggle('on',b.dataset.f===cur);});}
    $('#cTabs').innerHTML=Object.keys(C).map(function(k){return '<button data-f="'+k+'">'+k+'</button>';}).join('');
    $('#cTabs').onclick=function(e){var b=e.target.closest('[data-f]');if(b){cur=b.dataset.f;showC();}};showC();
    $('#cCopy').onclick=function(){try{navigator.clipboard.writeText(C[cur]);this.textContent='Copied ✓';var t=this;setTimeout(function(){t.textContent='Copy citation';},1800);}catch(x){}};
    $('#aMeta').innerHTML=[['Publisher',pub],['Published',dlong(a.published_at)],upd?['Updated',dlong(a.updated_at)]:null,['Section',a.category],['Permanent link','<a href="'+esc(url)+'" style="word-break:break-all">'+esc(url.replace('https://',''))+'</a>'],['Article ID',a.id]]
      .filter(Boolean).map(function(r){return '<tr><td>'+r[0]+'</td><td>'+(r[0]==='Permanent link'?r[1]:esc(r[1]))+'</td></tr>';}).join('');
    var enc=encodeURIComponent;
    $('#aShare').innerHTML='<a href="https://wa.me/?text='+enc(a.title+' '+url)+'" target="_blank" rel="noopener">WhatsApp</a><a href="https://www.linkedin.com/sharing/share-offsite/?url='+enc(url)+'" target="_blank" rel="noopener">LinkedIn</a><a href="https://twitter.com/intent/tweet?text='+enc(a.title)+'&url='+enc(url)+'" target="_blank" rel="noopener">X</a><button id="cpl">Copy link</button>';
    $('#cpl').onclick=function(){try{navigator.clipboard.writeText(url);this.textContent='Copied ✓';}catch(x){}};
    if(all){var more=all.articles.filter(function(x){return x.slug!==a.slug;}).slice(0,3);if(more.length){$('#moreWrap').classList.remove('hide');$('#more').innerHTML=more.map(tile).join('');}}
  }

  if(slug){Promise.all([get('action=article&slug='+encodeURIComponent(slug)),get('action=news')]).then(function(r){if(!r[0].ok){location.replace('/news/');return;}articleView(r[0],r[1]);})
    .catch(function(){$('#vList').classList.remove('hide');$('#list').innerHTML='<div class="card empty">We could not load this article right now.</div>';});}
  else get('action=news').then(listView).catch(function(){$('#list').innerHTML='<div class="card empty">We could not load the news right now. Please try again in a moment.</div>';});
})();
</script>
</body>
</html>
