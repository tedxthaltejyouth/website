<title>The Story of an Idea · TED, TEDx and TEDxThaltej Youth</title>
<meta name="description" content="An illustrated scroll story that explains what TED is, what TEDx is, and what TEDxThaltej Youth does. In English, Gujarati and Hindi.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{--red:#EB0028;--ease:cubic-bezier(.2,.7,.1,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;color:#fff}
  body{font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body.lang-gu{font-family:'Noto Sans Gujarati','Inter',Arial,sans-serif}
  body.lang-hi{font-family:'Noto Sans Devanagari','Inter',Arial,sans-serif}
  body.locked{overflow:hidden}
  button,input{font-family:inherit}
  svg text{font-family:inherit}
  a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:3px}
  .nm{color:var(--red)}

  /* ============ GATE ============ */
  #gate{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;padding:28px;overflow-y:auto;transition:opacity 1s var(--ease),visibility 1s}
  #gate.hide{opacity:0;visibility:hidden}
  #gate .spark{position:absolute;left:50%;top:14%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--red);box-shadow:0 0 30px 10px rgba(235,0,40,.55),0 0 90px 30px rgba(235,0,40,.25);animation:breathe 3.2s ease-in-out infinite}

  .gk{font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#8c8c8c;text-align:center}
  .gcard h1{margin-top:16px;text-align:center;font-size:clamp(34px,5.6vw,56px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
  .gcard .gs{margin-top:14px;text-align:center;font-size:17px;color:#a6a6a6;line-height:1.6}
  .fld{margin-top:40px}
  .fld label{display:block;font-size:13px;font-weight:600;letter-spacing:.06em;color:#bdbdbd;margin-bottom:10px}
  .fld input{width:100%;font-size:26px;font-weight:600;padding:14px 2px;border:0;border-bottom:2px solid #444;background:transparent;color:#fff;transition:border-color .3s;border-radius:0}
  .fld input:focus{outline:none;border-bottom-color:var(--red)}
  .fld input::placeholder{color:#555}
  .err{margin-top:8px;font-size:14px;color:#ff5c75;min-height:20px}
  .langs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .langs button{cursor:pointer;background:transparent;color:#fff;border:1px solid #3a3a3a;border-radius:12px;padding:16px 8px;transition:all .3s var(--ease)}
  .langs button b{display:block;font-size:20px;font-weight:700}
  .langs button span{display:block;margin-top:4px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#777}
  .langs button[aria-pressed="true"]{border-color:#fff;background:#fff;color:#000}
  .langs .gu b{font-family:'Noto Sans Gujarati',sans-serif}.langs .hi b{font-family:'Noto Sans Devanagari',sans-serif}
  .go{margin-top:40px;width:100%;cursor:pointer;background:var(--red);color:#fff;border:0;border-radius:999px;padding:18px;font-size:17px;font-weight:700;letter-spacing:.02em;transition:transform .3s var(--ease),box-shadow .3s}
  .go:hover{transform:translateY(-2px);box-shadow:0 12px 30px -10px rgba(235,0,40,.7)}
  .gf{margin-top:22px;text-align:center;font-size:12px;color:#6b6b6b}

  /* ============ TOP ============ */
  #top{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:18px 26px;pointer-events:none}
  #top > *{pointer-events:auto}
  .brand{font-size:14px;font-weight:700;letter-spacing:.01em;color:#fff;opacity:.9}
  .tr{display:flex;align-items:center;gap:14px}
  .lsw{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
  .lsw button{cursor:pointer;border:0;background:transparent;color:#bdbdbd;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;transition:all .25s}
  .lsw button[aria-pressed="true"]{background:#fff;color:#000}
  .lsw .gu{font-family:'Noto Sans Gujarati',sans-serif}.lsw .hi{font-family:'Noto Sans Devanagari',sans-serif}
  .ed{cursor:pointer;border:0;background:none;color:#8c8c8c;font-size:12px;font-weight:600;letter-spacing:.04em}
  .ed:hover{color:#fff}
  @media (max-width:600px){#top{padding:14px 16px}.brand{font-size:12px}.ed{display:none}}

  /* ============ STORY ============ */
  #story{position:relative}
  .stage{position:sticky;top:0;height:100vh;overflow:hidden}
  #art{position:absolute;top:0;right:110px;width:calc(64% - 110px);height:100%}
  #art svg{width:100%;height:100%;display:block}
  .narr{position:absolute;left:max(28px,calc((100vw - 1320px)/2));top:0;bottom:0;width:min(36%,520px);display:flex;align-items:center;pointer-events:none}
  .beat{position:absolute;left:0;right:0;opacity:0;transform:translateY(24px);will-change:opacity,transform}

  .beat .l{margin-top:16px;font-size:clamp(30px,3.5vw,54px);font-weight:700;letter-spacing:-.025em;line-height:1.1}
  .lang-gu .beat .l,.lang-hi .beat .l{letter-spacing:0;line-height:1.32}
  .beat .s{margin-top:18px;font-size:clamp(16px,1.35vw,20px);font-weight:400;color:#a6a6a6;line-height:1.6;max-width:460px}
  .beat .cta{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px;pointer-events:auto}
  .beat .cta a,.beat .cta button{cursor:pointer;font-size:15px;font-weight:700;text-decoration:none;padding:13px 20px;border-radius:999px;border:1px solid #fff;background:transparent;color:#fff;transition:all .25s}
  .beat .cta .p{background:var(--red);border-color:var(--red)}
  .beat .cta a:hover,.beat .cta button:hover{transform:translateY(-2px)}
  .rail{position:absolute;right:26px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:18px;z-index:3}
  .rail button{cursor:pointer;background:none;border:0;display:flex;align-items:center;justify-content:flex-end;gap:12px;color:#6b6b6b;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;transition:color .3s}
  .rail button i{width:22px;height:2px;background:#3a3a3a;transition:all .4s var(--ease)}
  .rail button.on{color:#fff}.rail button.on i{width:40px;background:var(--red)}
  .rail button span{opacity:0;transition:opacity .3s}
  .rail:hover button span{opacity:1}
  .hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#8c8c8c;transition:opacity .5s}
  .hint i{width:1px;height:40px;background:linear-gradient(#fff,transparent);animation:drop 2s var(--ease) infinite;transform-origin:top}
  @keyframes drop{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
  .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--red);width:0}
  @media (max-width:900px){
    #art{width:100%;height:60%;top:48px;right:0}
    .narr{left:0;right:0;width:auto;top:auto;bottom:0;height:44%;align-items:flex-start;padding:0 20px;background:linear-gradient(rgba(0,0,0,0),#000 20%)}
    .beat{top:30px;left:20px;right:20px}
    .beat .l{font-size:26px;margin-top:10px}
    .beat .s{font-size:15px;margin-top:10px}
    .beat .cta{margin-top:16px}.beat .cta a,.beat .cta button{font-size:13px;padding:10px 14px}
    .rail{display:none}.hint{display:none}
  }
  footer{background:#000;border-top:1px solid #1f1f1f;padding:40px 26px 46px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:18px;align-items:center}
  footer b{font-size:16px}
  footer p{font-size:13px;color:#bdbdbd}
  @media (prefers-reduced-motion:reduce){#gate .spark,.hint i{animation:none}}
</style>
</head>

      s:{en:'Short, powerful talks, usually 18 minutes or less.',gu:'ટૂંકી અને અસરકારક ટૉક્સ, સામાન્ય રીતે 18 મિનિટ કે તેથી ઓછી.',hi:'छोटी और असरदार टॉक्स, आमतौर पर 18 मिनट या उससे कम।'}},
    {l:{en:'Each talk is recorded and shared online, for free.',gu:'દરેક ટૉક રેકોર્ડ થાય છે અને ઑનલાઇન મફતમાં શેર થાય છે.',hi:'हर टॉक रिकॉर्ड होती है और ऑनलाइन मुफ़्त में शेयर होती है।'},
      s:{en:'One voice, in one room, can now reach anyone with a screen.',gu:'એક રૂમમાં બોલાયેલો એક અવાજ હવે સ્ક્રીન ધરાવતી કોઈ પણ વ્યક્તિ સુધી પહોંચી શકે છે.',hi:'एक कमरे में बोली गई एक आवाज़ अब स्क्रीन वाले किसी भी व्यक्ति तक पहुँच सकती है।'}},
    {l:{en:'And so, ideas began to travel the world.',gu:'અને આમ, વિચારો દુનિયાભરમાં ફરવા લાગ્યા.',hi:'और इस तरह, विचार दुनिया भर में सफ़र करने लगे।'}},
    {k:{en:'Chapter two · TEDx',gu:'પ્રકરણ બે · TEDx',hi:'अध्याय दो · TEDx'},
      l:{en:'But one conference cannot be in every city.',gu:'પણ એક કૉન્ફરન્સ દરેક શહેરમાં ન હોઈ શકે.',hi:'लेकिन एक कॉन्फ़्रेंस हर शहर में नहीं हो सकती।'},
      s:{en:'So TED invited communities everywhere to bring the idea home.',gu:'એટલે TED એ દરેક જગ્યાના સમુદાયોને આ વિચાર પોતાના ઘરે લાવવા આમંત્રણ આપ્યું.',hi:'इसलिए TED ने हर जगह के समुदायों को यह विचार अपने घर लाने का न्योता दिया।'}},
    {l:{en:'That is TEDx. The x means independently organised.',gu:'એ છે TEDx. x એટલે સ્વતંત્ર રીતે આયોજિત.',hi:'यही है TEDx। x का मतलब है स्वतंत्र रूप से आयोजित।'},
      s:{en:'Local teams run their own TED-style events, under a free licence from TED.',gu:'સ્થાનિક ટીમો TED પાસેથી મફત લાઇસન્સ લઈને પોતાના TED જેવા કાર્યક્રમો યોજે છે.',hi:'स्थानीय टीमें TED से मुफ़्त लाइसेंस लेकर अपने TED जैसे कार्यक्रम करती हैं।'}},
    {l:{en:'Every TEDx event keeps the same spirit.',gu:'દરેક TEDx કાર્યક્રમ એ જ ભાવના જાળવે છે.',hi:'हर TEDx कार्यक्रम वही भावना बनाए रखता है।'},
      s:{en:'No selling. No political or religious agendas. Just ideas.',gu:'કોઈ વેચાણ નહીં. કોઈ રાજકીય કે ધાર્મિક એજન્ડા નહીં. ફક્ત વિચારો.',hi:'कोई बिक्री नहीं। कोई राजनीतिक या धार्मिक एजेंडा नहीं। सिर्फ़ विचार।'}},
    {l:{en:'Today, TEDx events happen in cities, schools and communities across the world.',gu:'આજે દુનિયાભરના શહેરો, શાળાઓ અને સમુદાયોમાં TEDx કાર્યક્રમો થાય છે.',hi:'आज दुनिया भर के शहरों, स्कूलों और समुदायों में TEDx कार्यक्रम होते हैं।'}},
    {k:{en:'Chapter three · TEDxThaltej Youth',gu:'પ્રકરણ ત્રણ · TEDxThaltej Youth',hi:'अध्याय तीन · TEDxThaltej Youth'},
      l:{en:'One of those communities is right here, in Ahmedabad.',gu:'એમાંનો એક સમુદાય અહીં જ છે, અમદાવાદમાં.',hi:'उनमें से एक समुदाय यहीं है, अहमदाबाद में।'}},
    {l:{en:'TEDxThaltej Youth.',gu:'TEDxThaltej Youth.',hi:'TEDxThaltej Youth.'},
      s:{en:'A TEDx event from Thaltej, Ahmedabad, organised by young people.',gu:'થલતેજ, અમદાવાદનો TEDx કાર્યક્રમ, જે યુવાનો દ્વારા આયોજિત છે.',hi:'थलतेज, अहमदाबाद का एक TEDx कार्यक्रम, जिसे युवा आयोजित करते हैं।'}},
    {l:{en:'We bring ideas worth spreading to our city’s stage.',gu:'અમે અમારા શહેરના મંચ પર ફેલાવવા લાયક વિચારો લાવીએ છીએ.',hi:'हम अपने शहर के मंच पर फैलाने लायक विचार लाते हैं।'},
      s:{en:'Talks that spread ideas. Virasat, performances that carry our heritage. Ahmedabad Idea Search, listening for ideas all year. And a team of young people learning to build something real.',gu:'વિચારો ફેલાવતી ટૉક્સ. વિરાસત, આપણો વારસો રજૂ કરતી પ્રસ્તુતિઓ. અમદાવાદ આઇડિયા સર્ચ, આખું વર્ષ વિચારોને સાંભળતી પહેલ. અને કંઈક સાચું બનાવતા શીખતા યુવાનોની ટીમ.',hi:'विचार फैलाने वाली टॉक्स। विरासत, हमारी धरोहर को आगे ले जाती प्रस्तुतियाँ। अहमदाबाद आइडिया सर्च, पूरे साल विचारों को सुनने की पहल। और कुछ असली बनाना सीखते युवाओं की टीम।'}},
    {l:{en:'Because every city is full of ideas.',gu:'કારણ કે દરેક શહેર વિચારોથી ભરેલું છે.',hi:'क्योंकि हर शहर विचारों से भरा है।'},
      s:{en:'Most of them are simply waiting to be heard.',gu:'તેમાંના મોટા ભાગના બસ સાંભળવામાં આવે તેની રાહ જુએ છે.',hi:'उनमें से ज़्यादातर बस सुने जाने का इंतज़ार कर रहे हैं।'}},

      var gx=GX+Math.cos(i*0.9)*GR*0.7, gy=GY+Math.sin(i*1.3)*GR*0.55;

    var cur=Math.floor(clamp(P,0,N-0.01));

  requestAnimationFrame(frame);
})();
